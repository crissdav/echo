# Echo — VirtualHost de Apache
# Solo la carpeta public/ es accesible desde Internet; app/, database/, .env y vendor/ quedan fuera.
<VirtualHost *:80>
    ServerName echo
    DocumentRoot /var/www/echo/public

    <Directory /var/www/echo/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Defensa extra: nunca servir archivos ocultos (.env, .git)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/echo_error.log
    CustomLog ${APACHE_LOG_DIR}/echo_access.log combined
</VirtualHost>
